name: Scan & deploy

# GitHub's scheduler can't run more often than every 5 minutes, and scheduled runs are
# sometimes delayed by a few minutes when GitHub is busy.
on:
  schedule:
    - cron: '1-59/5 * * * 1-5'   # every 5 min, Mon–Fri (UTC)
    - cron: '3-59/15 * * * 0,6'  # every 15 min, Sat–Sun
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      test_push:
        description: Send a test notification to every registered device
        type: boolean
        default: false

permissions:
  contents: write   # remove expired push subscriptions
  pages: write      # deploy the app + fresh data to GitHub Pages
  id-token: write
  actions: write    # prune old state caches, keep the schedule from being auto-disabled

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scanner/package-lock.json

      - name: Install scanner
        working-directory: scanner
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Restore scanner state
        uses: actions/cache/restore@v6
        with:
          path: .state
          key: tp-state-${{ github.run_id }}
          restore-keys: tp-state-

      - name: Build app
        run: node scanner/build.mjs --out _site
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          INBOX_PUBLIC_KEY: ${{ vars.INBOX_PUBLIC_KEY }}

      - name: Scan news & quotes, send alerts
        run: node scanner/scan.mjs --state .state --out _site/data
        env:
          TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.test_push && 'true' || 'false' }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          INBOX_PRIVATE_KEY: ${{ secrets.INBOX_PRIVATE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save scanner state
        uses: actions/cache/save@v6
        with:
          path: .state
          key: tp-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key tp-state- --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
